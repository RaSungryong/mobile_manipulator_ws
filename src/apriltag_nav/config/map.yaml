# AprilTag Navigation Map Configuration
# All map topology, tag coordinates, and task definitions
#
# Frame: origin = centre of 정반 1, +x = east, +y = north, unit = metre.
# Tag positions are the FLOOR TAG, not the robot stop pose: the front camera
# sits 0.55 m ahead of robot centre and looks straight down, so the robot
# centre stops 0.55 m behind the tag along its heading.
# zone selects the tag->pose transform in mobile_controller: A/DOCK = heading 0
# (east), B/D = +90 (north), C/E = -90 (south).
#
# 2026-09-04 — five pivot tags were physically re-laid (503, 505, 506,
# 507, 508) and tape-measured against their neighbouring WORK tag, which
# stayed put; only the measured axis of the moved tag changed, every
# other tag keeps its design value:
#     111 ↔ 505 = 1.03 m → 505 y 3.58      113 ↔ 506 = 0.64 m → 506 y 2.49
#     137 ↔ 507 = 1.04 m → 507 y 3.59      138 ↔ 508 = 0.62 m → 508 y 2.47 (= design)
#     502 ↔ 503 = 0.50 m → 503 x 2.76
#   Consequences: 503's stop pose is now x 2.21, 3 cm east of the zone D
#   lane (2.18) where 507 still sits — the 503→507 pivot lands the front
#   camera ~3 cm beside 507 and align/Pure Pursuit take it from there. The
#   exit tags are no longer exactly 0.55 from the y 3.02 lane (505/507
#   0.56/0.57 north, 506 0.53 south); that only changes those hops' odom
#   distances. The plate-to-plate distance was measured at 3.90 m the same
#   day (design 3.89) — applied to reference_tags_plate2.yaml (the cross
#   tags ON 정반 2), NOT to the D/E floor lanes, which stay at 2.18 / 5.6.
#
# 2026-09-22 — zone B + C WORK tags (100-125) carry the CALIBRATED position
# from the map calibration of that day (two complete plate-1 sessions on
# the 2026-09-22 tf chain, per-tag mean; session-to-session xy 0.3/0.4 mm
# sd, max 0.9 mm): log/path_tag_locator/map_world_20260922_plate1_final.yaml
# (copy: config/map_world_plate1_20260922.yaml). The design value stays in
# the trailing comment. Net: zone B within +-3 mm of design, zone C lane
# x -16.7 +- 6.3 mm (all 13 tags, both sessions), y within 3 mm. Every
# other tag (dock, pivots, zone A, plates D/E) is still the design value.
#   Same day, later (user: use every calibrated value): those 26 tags also
#   carry `yaw` (world heading of the
#   tag's x axis, CCW +; /robot_pose adds its deviation from the lane axis
#   to theta, robot.yaml robot.robot_pose_use_tag_yaw); navigation itself
#   does not read it. The calibrated z (tag top, -57 +- 10 mm vs the design
#   -79) and roll / pitch are in the map_world file only: the user decided
#   NOT to use z (arm_calibration.use_tag_z false, lines removed), and a
#   floor tag's tilt is the chain's measurement of the chassis attitude,
#   not map data.
#
# 2026-09-28 — tags 100-125 (all 26) UPDATED from the plate-1 session of
# 16:14 (log/path_tag_locator/map_world_20260928_161429.yaml, 26/26 ok,
# copy: config/map_world_plate1_20260928.yaml), on the T_ab2mb shifted by
# (-1, +7) mm that morning (CLAUDE.md Work Log 2026-09-28 evening). It
# replaces the 14:04 session of the same day (map_world_20260928_140412,
# 23 tags — 118-120 failed there, cross tag 4 not detected from the seed):
# 14:04 -> 16:14 xy differs by <= 4 mm (B +-2 mm, C 121-125 -2..-4 mm
# both axes), yaw <= 0.2 deg. 118-120 are now measured, (-3, +0.5) mm from
# their 09-22 values — the same zone C move the shift gave every other tag.
# Against the 09-22 values the net move is B (+3.6, +1.5) / C (-3.2, -1.2)
# mm. The trailing comment carries the design value and the value it
# replaced (14:04, or 09-22 for 118-120).
#
