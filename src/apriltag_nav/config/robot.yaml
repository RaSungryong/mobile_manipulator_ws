robot:
  # Drivetrain geometry, copied from ~/navifra/param.yaml `base_controller`
  # (2026-08-13). ⚠️ That file is the SOURCE OF TRUTH — the navifra driver owns
  # odometry and nothing in apriltag_nav reads these two. They are duplicated
  # here only so the base's geometry is visible in one place; if they ever
  # disagree, param.yaml wins and this copy is the stale one.
  wheel_radius: 0.0825     # [m] wheel radius (0.165 m diameter)
  wheel_separation: 0.65   # [m] left/right wheel track

  # Dimensions (meters) — the replacement base, measured 2026-08-13. The old
  # one was 0.80 x 0.50; the body grew 100 mm longer and 200 mm wider, which
  # also resolves the impossible 0.50 width (narrower than the 0.65 wheel
  # track). Nothing in apriltag_nav reads either key — see the clearance
  # warning at wall_dist_work_zone below, which is now the live consequence.
  length: 0.90
  width: 0.70
  # Distance from robot centre to the front_cam lens, along +body X (forward).
  # 0.45 -> 0.547 on 2026-08-13 (measured on the replacement base), -> 0.55 on
  # 2026-08-21. 0.55 is the number the new cell's map.yaml was GENERATED from:
  # every tag sits at `stop pose + 0.55 * heading`, so a different value here
  # puts the computed pose somewhere the tag grid does not agree with.
  # ⚠️ The 3 mm against the 2026-08-13 measurement is unreconciled — if 547 is
  # the true lens position, the tags are the thing to move, not this key.
  # Must equal the tx of path_tag_locator/config/extrinsics.yaml `T_mb2fc`.
  # This is the ONE key in this block that code actually reads
  # (mobile_controller.calculate_robot_pose).
  camera_offset: 0.55

  # Movement limits
  max_linear_speed: 0.1    # Maximum linear velocity (m/s)
  max_angular_speed: 0.25   # Maximum angular velocity (rad/s), pivot turn only
  # Non-pivot steering cap. 0.12 -> 0.25 on 2026-09-04 (user: the steering
  # limit was too small for Pure Pursuit to work). Pivot turns use
  # max_angular_speed above; align has its own cap below.
  move_max_angular_speed: 0.25
  align_max_angular_speed: 0.12
  slow_factor: 0.3          # Speed multiplier for docking/precision

  # Minimum velocity settings (as ratio of max speed)
  # ⚠️ Both of these are read by nothing (see CLAUDE.md).
  min_linear_factor: 0.3    # min_linear = 0.3 * max_linear = 0.015 m/s
  min_angular_factor: 0.25  # min_angular = 0.25 * max_angular = 0.0625 rad/s

  # ⚠️ THERE IS NO ABSOLUTE SPEED FLOOR. A `min_drive_speed: 0.015` clamp was
  # added on 2026-08-14 and REMOVED the same day, on the user's decision, once
  # it turned out to have no source: no minimum rpm and no deadband is
  # documented anywhere in the navifra driver (param.yaml, base_controller.yaml,
  # motor_driver.yaml all checked), and the 2026-08-12 hardware drive ran a
  # 0.01 m/s floor (~10.4 rpm at the motor) with the base moving normally.
  # Clamping every command up to an invented number is worse than not clamping:
  # it silently changes commanded motion to defend a limit nobody has measured.
  #
  # If a real stiction floor is ever MEASURED, this is where it goes — and it
  # belongs here as an absolute m/s value rather than as a ratio of
  # max_linear_speed, because a ratio walks the floor every time the top speed
  # is retuned (0.2 * max is 0.02 m/s today but was 0.01 m/s at max 0.05).

  # Speed the robot is at when the tag reaches the stop point, m/s. NOT a floor
  # — it applies only inside final_approach_dist below, and nothing else is
  # clamped to it. 0.010 m/s is ~10.4 rpm at the motor (0.010 / 0.0825 m wheel
  # radius, x9 gear), which is the floor the 2026-08-12 hardware drive ran at
  # with the base moving normally.
  final_approach_speed: 0.010
  # Speed multiplier applied to the profile speed from the moment the target
  # tag is detected until the stop (the visual Pure Pursuit phase). User
  # request 2026-09-02 ("태그가 발견된 후 퓨어퍼슛할 때 1/3로"): at
  # max_linear_speed 0.1 the robot closes on the tag at ~0.033 m/s instead
  # of 0.1. Blind driving (prediction or straight) keeps the full profile;
  # the 6 cm final approach still takes over at the end and now starts from
  # this lower speed, so its solved deceleration is gentler too. 1.0 = off.
  tag_visible_speed_factor: 0.333
  # Odom-based creep zone: inside the last `blind_approach_dist` m of the
  # map edge length (by odometry), the command is capped at
  # `blind_approach_speed`, tag visible or not. Added 2026-09-02 for the
  # "stops past the tag" complaint: in REVERSE the target tag is hidden
  # behind the front bumper (the lens is 100 mm ahead of it) until ~3 cm
  # from the lens, so the tag-based final approach latched at 2.5-2.9 cm
  # from 0.030-0.037 m/s and the stop fired at 0.020-0.024 m/s -> 6-17 mm of
  # roll (forward: tag seen 26 cm out, stop at 0.010 m/s, 1-2 mm). Odom
  # remaining was within 3 mm of the tag stop on those hops, so it can carry
  # the pre-slowdown. 0.12 m leaves margin for the ~6 cm odom error seen on
  # the 1 m pivot-exit hop. Cost: ~8 s per hop at 0.015 m/s. Forward is
  # already this slow by then (final approach entries were 0.010-0.015).
  # 0 disables.
  blind_approach_dist: 0.15      # 0.12 -> 0.15 on 2026-09-04 (user: 감속 구간 살짝 더 길게)
  blind_approach_speed: 0.015

  # FINAL APPROACH (mobile_controller.execute_pure_pursuit).
  # Distance before the tag reaches the stop point at which the robot drops to
  # final_approach_speed and holds it until the stop condition fires. Measured from
  # the SAME pixel quantity the stop test uses (center_x vs
  # center_x_stop_offset), converted to metres with the tag depth and fx, so
  # the trigger and the stop cannot disagree about where the target is.
  #
  # Latched: once inside, the robot stays at final_approach_speed even if the tag
  # flickers out of detection for a frame, and the latch clears when the stop
  # condition fires. Without the latch a single dropped detection re-accelerates
  # the robot a few centimetres from the tag.
  #
  # This distance is honoured REGARDLESS of max_linear_speed. The approach does
  # not step the target and let the normal ramp chase it — it captures the
  # entry speed at the latch and follows its own braking envelope
  #     v(remaining) = sqrt(v_final^2 + 2 * a * remaining)
  # with `a` solved so the curve passes through the entry speed at this
  # distance and reaches final_approach_speed at the stop point:
  #     a = (v_entry^2 - v_final^2) / (2 * final_approach_dist)
  # Deceleration is constant, so speed falls linearly in time.
  #
  # ⚠️ That `a` can EXCEED linear_accel, and is allowed to. Entering at the
  # full 0.1 m/s needs 0.0825 m/s^2, 1.65x the normal 0.05 ramp; entering at
  # 0.05 m/s needs only 0.020 and the normal ramp is used instead. Shortening
  # this distance raises the required deceleration quadratically in the entry
  # speed — 0.03 m at 0.1 m/s would demand 0.165 m/s^2.
  final_approach_dist: 0.08      # 0.06 -> 0.08 on 2026-09-04 (user: 감속 구간 살짝 더 길게)
  # Launch yaw hold (2026-09-04, user: "제자리 얼라인 후 직진하면 한쪽
  # 바퀴가 살짝 늦게 도는지 요가 기울면서 출발"). Pure Pursuit's omega is
  # |speed| x curvature x gain — ~0 at launch and blind to yaw — so a wheel
  # that starts late twists the base and nothing corrects it until the
  # twist has become a lateral offset. Inside the first launch_yaw_hold_dist
  # m of every move hop an extra omega = -launch_yaw_gain x yaw_error holds
  # the heading the align established: yaw_error is the tag's edge angle
  # while the tag is in view (only ~3 cm forward — the bumper hides the
  # floor behind the lens — longer in reverse), else odom yaw minus the yaw
  # at the hop start (the encoders DO see a late wheel: it is a wheel-speed
  # differential, not slip). Gain 1.0 rad/s per rad: a 1 deg twist asks
  # 0.017 rad/s, well inside move_max_angular_speed. 0 disables.
  # 0.15 -> 10.0 on 2026-09-04 (user: forward is worse than reverse). The
  # records showed the forward yaw error at arrival on the zone A lane
  # (-0.6 .. -1.7 deg, blind part driven with omega = 0 because map
  # prediction is off there) was 3-6x the zone C value (-0.15 .. -0.28,
  # prediction on); in reverse the start tag stays in view ~19 cm so the
  # tag-anchored hold covered most of the blind part anyway. Holding the
  # heading for the WHOLE hop (odom yaw against the reference the last
  # seen tag anchored) is not map prediction — it is driving straight
  # properly — so it stays on for the lane hops too.
  launch_yaw_hold_dist: 10.0
  launch_yaw_gain: 1.0
  # Backlash feed-forward (2026-09-04, user: "얼라인 때 후진을 줬던 바퀴가
  # 출발 때 반응이 늦다"). The wheel that was backing during the align has
  # to reverse on the next hop and sits idle through its gear play while
  # the other wheel rolls: the base twists toward the late wheel by
  # play / track (0.65 m) — 0.7 deg per 8 mm of play — and a motor-side
  # encoder does not see it. The direction is known from the align's last
  # turn (CCW align -> twist CCW, on forward AND reverse hops), so for the
  # first launch_backlash_ff_s of every hop omega gets
  # -sign(last align turn) x launch_backlash_ff_omega on top of the hold.
  # 0.02 rad/s x 0.3 s = 0.34 deg of pre-rotation. Fit it from nav_log:
  # every arrival record carries launch_peak_yaw_err_deg (tag-measured
  # while the start tag is in view) and last_align_turn_sign — raise the
  # value while the (signed) peak keeps the sign of the align turn, lower
  # it once it flips. 0 disables.
  launch_backlash_ff_omega: 0.02
  launch_backlash_ff_s: 0.3

  # Velocity ramping (for smooth start/stop)
  # Set to 0 to disable ramping
  linear_accel: 0.05        # Linear acceleration limit (m/s²)
  angular_accel: 0.3        # Angular acceleration limit (rad/s²)
  ramp_enabled: true        # Enable/disable velocity ramping

  # AprilTag settings
  # tag_size here is only the per-camera fallback for robot_camera.tag_size
  # below, which is where the real sizes live — the cell has two of them.
  # 0.09 = the floor tags, the majority case.
  tag_size: 0.09
  tag_family: "tag36h11"

  # Wall Distance Safety (meters)
  # Robot's right side is always facing the wall
  #
  # These are centre-to-wall distances and they track the body half-width:
  #   old base: 0.35 - 0.25 (half of 0.50) = 0.10 = min_wall_clearance
  #   new base: 0.45 - 0.35 (half of 0.70) = 0.10, preserved
  # Raised 0.35 -> 0.45 on 2026-08-13, confirmed by the user: the 0.70 m body
  # has to sit 100 mm further off the wall. The arm was physically moved 100 mm
  # the other way (see arm_calibration.arm_body_offset_y) so its absolute
  # position over the workpiece is unchanged.
  #
  # Both now describe the new cell (2026-08-21), where every corridor lane sits
  # exactly 450 from the 정반 face — so work zone keeps 0.45 unchanged and its
  # 0.10 clearance. Zone A does NOT follow that rule: its lane is y = 3.02 and
  # 정반 1's top edge is y = 2.50, i.e. 0.52, chosen to balance the pivot
  # between the north wall and the plate corner rather than to hold 0.10.
  # (0.6275 was the old cell's zone A and no longer describes anything.)
  # Nothing in apriltag_nav reads these three keys — the robot's real stop
  # position comes from centring the tag under front_cam, not from here.
  wall_dist_work_zone: 0.45  # Zones B, C, D, E
  wall_dist_zone_a: 0.52     # Zone A
  min_wall_clearance: 0.10

  # Pure Pursuit Tuning
  # Pure Pursuit look-ahead. 0.4 -> 0.25 on 2026-09-04: the curvature PP
  # commands is 2*lateral/L^2, so with L = 0.4 a lateral error decayed over
  # ~0.4 m — the whole length of a corridor hop — and the tag was never
  # centred before the stop. 0.25 gives 2.6x the steering for the same
  # error; sim-checked against the 0.55 s command delay for oscillation.
  # (tag['z'] is the ~0.30 m camera height, so max(dist, L) = L always.)
  look_ahead_base: 0.25
  # Which point Pure Pursuit puts on the lane line (2026-09-04): 'base' =
  # the base centre, using lateral - camera_offset*sin(yaw error); 'lens' =
  # the old behaviour (the camera itself). The lens is 0.55 m ahead of the
  # point the align rotates about, so with 'lens' every align swung the
  # lens 0.55*sin(yaw) sideways — robot records 14:33: arrival lateral
  # +1.5 mm / yaw -1.66 deg -> +19.5 mm after the align, and a steady
  # -13 mm lateral bias at rest on forward runs. With 'base' the align
  # lands the lens ON the tag instead.
  pp_lateral_reference: base
  # ---- steering law while the target tag is in view (2026-09-04) ----
  # state_feedback: omega = -(v * sf_lateral_gain) * e_y - sf_heading_gain *
  # e_theta, e_y = base-referenced lateral (m), e_theta = PREDICTED heading
  # error (current edge angle + the rotation still pending from the last
  # stop_latency_s of commands). The lateral gain scales with speed like
  # Pure Pursuit did (32 = 2 / 0.25^2, i.e. the PP curvature at L 0.25);
  # the heading term does not, which is what gives it authority in the
  # 0.01-0.03 m/s last 25 cm where PP (omega ~ speed) had none. Closed
  # loop: wn = v*sqrt(k_y), zeta = k_theta/(2 v sqrt(k_y)) = 1.6 at
  # 0.033 m/s, 0.53 at 0.1 m/s. Below sf_min_speed_for_gain the lateral
  # gain is held at that speed so creeping still steers. 'pure_pursuit'
  # restores the old point tracker.
  steer_mode: state_feedback
  sf_lateral_gain: 32.0
  sf_heading_gain: 0.6
  sf_min_speed_for_gain: 0.02
  # Measurement conditioning (2026-09-04): every steering/stop/align decision
  # uses the MEDIAN of the last stop_measure_frames detections of the tag
  # (one bad frame cannot fire the stop) extrapolated to now along the
  # fore-aft axis by the executed speed x frame age — the detector's frame
  # is ~0.1 s old, 3-4 mm at 0.033 m/s. Records carry age_s / comp_px.
  stop_measure_frames: 3
  camera_latency_compensation: true
  pp_gain_forward: 1.0
  pp_gain_backward: 0.8

  # Temporary bypass for pivot-exit tags that are not physically installed.
  # These tag IDs still exist in map.yaml so BFS can route through them, but
  # navigation does not require front_cam detection or final align_to_tag() for
  # them. Remove the IDs or set enabled=false once the physical tags are placed.
  temporary_missing_tags:
    enabled: false
    tag_ids: [506, 507, 508]
    odom_arrival_ratio: 0.98

  # Predictive centering before the next tag is visible.
  # When a tag-to-tag move starts, mobile_controller projects /odom motion onto
  # the calibrated start→target tag line and steers the front camera toward a
  # preview point on that line. As soon as target_id appears in front_cam, the
  # existing visual Pure Pursuit + image-centre stop condition takes over.
  predictive_centering:
    enabled: true
    # "latest" means newest ~/.ros/path_tag_locator/map_world_*.yaml from the
    # calibration pipeline. Blind (tag-not-visible) steering ALWAYS has a line
    # to follow: the calibrated map_world segment when both endpoints are in
    # it, otherwise the map.yaml geometry (2026-09-02; before this, a present
    # map_world file with a missing endpoint disabled prediction for that
    # segment because fallback_to_map_yaml was false).
    use_map_world: true
    fallback_to_map_yaml: true     # no longer read; map.yaml is always the fallback
    map_world_path: "latest"
    # Hops that touch any tag in these ranges / ids run WITHOUT prediction
    # (user request 2026-09-02): tag visible -> plain Pure Pursuit, tag not
    # visible -> straight-line command (no map/odom steering), stop line ->
    # in-place align_to_tag. The approach-heading blend and ApproachBalance
    # slowdown are off for them too. A hop is excluded when EITHER its start
    # or its target tag matches, so 501->400 and 405->502 count as well.
    # 400-499 is the zone A transit lane (400-411 today).
    disabled_tag_ranges: [[400, 499]]
    disabled_tag_ids: []
    # Blind steering uses the same base Pure Pursuit tuning as visible-tag
    # steering, but caps lookahead by segment length so short pivot-exit moves
    # react before the large skid base runs out of distance.
    lookahead_m: 0.4
    min_lookahead_m: 0.20
    lookahead_segment_ratio: 0.40
    gain_forward: 1.0
    gain_backward: 0.8
    # Small yaw hold term in addition to the preview curvature. Keep modest:
    # it should keep the body aligned with the calibrated segment, not fight
    # the visual controller once the tag is detected.
    heading_gain: 0.4
    # Once the target tag is visible, blend tag-edge yaw error into the normal
    # Pure Pursuit steering so final align_to_tag() is only a small trim.
    approach_heading_gain: 0.8
    # Near the center_x stop line, slow the approach if lateral image-centre
    # error or yaw error is still large. This gives the moving Pure Pursuit
    # segment time to remove y error before the final in-place trim.
    approach_center_y_tolerance_px: 20.0
    approach_yaw_tolerance_deg: 0.5
    approach_slow_window_px: 180.0
    approach_error_slow_speed: 0.010
    # (post_move_align_enabled / post_move_align_y_tolerance_px removed
    # 2026-09-02: every hop now ends with stop -> align_to_tag, no exceptions.)
    # Camera-centre-vs-tag records while driving. Every TASK / GOTO command
    # opens a NEW yaml under this directory (<YYYYMMDD>/<YYYYMMDD_HHMMSS>_<cmd>.yaml)
    # and every arrival ('arrival' = pure-pursuit stop, 'aligned' = after the
    # yaw trim) is appended to it — nothing is ever overwritten (2026-09-02;
    # before this, one tag_alignment_results.yaml was overwritten per tag and
    # nothing was recorded at all without a map_world file). The camera-frame
    # numbers are always recorded; the latest map_world_*.yaml, when present,
    # only adds a world-frame reference and is never modified.
    record_alignment_result: true
    alignment_result_dir: "~/.ros/apriltag_nav/nav_log"

  # Alignment Tuning — align_to_tag() runs after EVERY hop (forward,
  # backward AND pivot, 2026-09-02): base stops, then rotates in place until
  # the tag edge reads square. Yaw only; it never translates.
  align_gain: 0.8           # Proportional gain for alignment rotation
  # Tightened 0.5 -> 0.2 on 2026-09-02 (user: "더 빡세게"). Basis: 194 real
  # aligns that day ended at median 0.24 deg, and every one that took ~2 s
  # stopped at 0.43-0.49 — i.e. the loop was exiting the moment it crossed
  # 0.5, not converging. 0.2 deg is ~1.9 mm of lens travel over the 0.55 m
  # camera offset. Watch align duration and the 20 s timeout after this.
  align_threshold_deg: 0.2  # Alignment complete when angle < this (degrees)
  # Floor on the commanded |angular| during align (rad/s). The P term alone
  # gives 0.8 * 0.2 deg = 0.0028 rad/s near the new threshold, which the
  # skid base may not execute at all; the base was OBSERVED still turning at
  # 0.0063 rad/s (0.45 deg * 0.8) on 2026-09-02, so 0.01 is at a speed known
  # to move it. One 10 Hz tick at the floor is 0.057 deg — well inside the
  # 0.2 deg band. 0 disables the floor.
  align_min_angular_speed: 0.01
  # Give up (hop FAILS) if not squared up within this many seconds — covers a
  # tag that is out of frame after an odometry-only pivot or an arrival at
  # the frame edge. Before 2026-09-02 the loop waited forever. <= 0 disables.
  align_timeout_s: 20.0
  # Skid-steer overshoot (2026-09-04, user: "제자리 얼라인할 때 오차보다 좀 더
  # 회전해서 틀어진다"). The base executes an in-place turn with the same
  # ~stop_latency_s transport delay as the drive, so at the 0.01 rad/s floor
  # alone it turns another 0.55 s * 0.01 = 0.32 deg AFTER the loop sees the
  # error inside the 0.2 deg band — i.e. it always ended outside it, on the
  # far side. align_to_tag now (1) stops when the PREDICTED settled angle
  # (error minus the rotation still pending from the last stop_latency_s of
  # commands) is inside the band, (2) waits stop_latency_s + align_settle_s
  # with zero command, (3) re-measures at rest and, if still outside the
  # band, corrects again — up to align_max_passes. Only a measurement taken
  # at rest counts. If the tag still reads off after the last pass the hop
  # is accepted with a warning and `align_residual_accepted` in the record.
  align_settle_s: 0.3
  align_max_passes: 3
  # ---- align_mode: continuous (default) | pulse ----
  # 'continuous' = the P loop with the delay lead + settle + re-measure
  # above. Robot records 14:33 on 2026-09-04 (first run with it): every
  # aligned yaw AT REST within +-0.19 deg, 1-3 passes. What looked like
  # over-rotation was the lens swinging sideways during the align — see
  # pp_lateral_reference. 'pulse' is the alternative for a base that
  # sticks and lurches: it never decides while moving — measure at rest
  # (median of align_measure_frames), command ONE burst of
  # align_pulse_omega for the DURATION that rotates align_pulse_fraction of
  # the error, stop, settle (stop_latency_s + align_settle_s), re-measure;
  # the achieved/commanded ratio is learned into a gain (kept across hops)
  # so a base that lurches 1.5x is corrected on the next pulse. A delay
  # shifts a burst in time but cannot lengthen it. The 0.8 fraction
  # prefers a second pulse in the SAME direction over an overshoot, which
  # would reverse a wheel (backlash). Offline it was SLOWER than continuous
  # (5-8 s vs 2 s) and reversed more on a lurching plant, so it is not the
  # default; switch to it only if the continuous loop misbehaves on the
  # robot.
  align_mode: continuous
  align_pulse_omega: 0.05        # rad/s of a burst — well above stiction
  align_pulse_fraction: 0.8
  align_pulse_min_s: 0.1         # shortest burst (one 10 Hz tick); smaller errors lower omega
  align_max_pulses: 5
  align_measure_frames: 5        # median over this many frames at rest
  # The stop aims the predicted settled angle at this fraction of the band
  # (0.25 * 0.2 = 0.05 deg), not at the band edge — one 10 Hz tick at the
  # 0.01 rad/s floor is 0.057 deg of pending rotation, so finer is noise.
  align_lead_target_ratio: 0.25
  # ⚠️ EVERY hop ends with stop -> align_to_tag, no per-tag exception (user
  # rule 2026-09-04: "어떤 상황이든 정지해서 얼라인은 필수"). The
  # `align_skip_tag_ranges: [[400, 499]]` key from 2026-09-02 (400->401 …
  # 410->411 lane hops were Pure Pursuit only) is retired: mobile_controller
  # ignores it with a warning if it is ever put back. A tag out of view at
  # rest now fails the hop on align_timeout_s instead of being waved on.

  # Pivot Tuning
  pivot_gain: 1.5           # Proportional gain for pivot rotation
  pivot_slowdown_deg: 10.0  # Start slowing down when error < this (degrees)
  pivot_threshold_deg: 1.0  # Pivot complete when error < this (degrees)

  # Manual relative moves — robot_ui's Mobile tab, via /mobile/move_cmd on
  # mobile_node (MobileController.drive_distance / pivot_angle). Ported from
  # tools/vw_drive.py so the UI does NOT become a second /cmd_vel publisher.
  # Odometry-closed trapezoid: v = min(top, sqrt(2*a*remaining)) with the
  # linear_accel / angular_accel above, hand-off to a constant-accel ramp-out
  # when the commanded speed's stopping distance equals what is left. No tag
  # is involved and nothing here touches navigation.
  manual_move:
    arrive_tol_m: 0.003          # loop hands off to the ramp-out here
    pivot_tol_deg: 1.0           # same for pivots (default: pivot_threshold_deg)
    stall_grace_s: 2.5           # commanding motion this long with no odom
                                 # change aborts (frozen /odom = dead drive)
    stall_eps_m: 0.005           # odom movement below this does not count
    stall_eps_deg: 0.5
    odom_stale_s: 1.0            # no /odom for this long = driver not talking
    ramp_out_max_s: 5.0          # bound on the ramp-out
    shortfall_frac: 0.05         # ending this far short of target = failure
    max_distance_m: 5.0          # a single manual move is refused above this
    max_angle_deg: 360.0
    default_linear_speed: 0.05   # used when the request carries no speed;
    default_angular_speed: 0.2   # 0 = the max_*_speed above. Always capped
                                 # by max_linear_speed / max_angular_speed.

  # S-Curve Settings (for smooth velocity profile)
  s_curve_accel_ratio: 0.3  # First 30% of distance: accelerate
  s_curve_decel_ratio: 0.4  # Last 40% of distance: decelerate
  s_curve_min_speed_factor: 0.2  # Minimum speed = 0.2 * max_speed

  # Stopping condition, in pixels relative to the image centre X.
  #
  # ⚠️ This was `center_y_stop_offset: -50.0` until 2026-08-13. front_cam was
  # rotated -90 deg about its optical axis, so the FORE/AFT axis in the image
  # is now the COLUMN axis, not the row axis — and it DECREASES as the robot
  # drives forward (image right = robot forward). Both the key and the sign
  # flipped; +50.0 here is the same physical stopping point the old -50.0 gave.
  #
  # 0 = image centre.
  # Positive = stops 'earlier' (tag still ahead, toward the right of frame).
  # Negative = stops 'later'  (robot has driven further over the tag).
  #
  # ONE target column for BOTH directions (user decision 2026-09-02): the
  # tag stops at cx + offset whether the robot arrives forward (tag enters
  # from image-right and stops just short of that column) or in reverse (tag
  # enters from image-left and stops just short of it from the other side).
  # Same physical spot over the tag either way, to within the tolerance.
  # A direction-mirrored variant (cx - offset in reverse) was tried and
  # backed out the same day. At ~0.30 m depth and fx ~750 px, 50 px ≈ 20 mm.
  #
  # 50 -> 0 on 2026-09-02 (user: "태그 중심이 목표 중심점에 와야 정지"): the
  # target column IS the optical axis (the overlay crosshair) now. The +50
  # used to leave margin so the tag stayed in frame for align_to_tag; at 0
  # the tag sits dead centre, which is the best place for it. ⚠️ Expect the
  # tag to land ~15-20 px PAST the crosshair (image-left when driving
  # forward, image-right in reverse) — that is the measured 6-8 mm roll
  # after the trigger, not this key. Raise this (≈ +18) to pre-compensate.
  # 0 -> 300 on 2026-09-04 (user: "후진은 너무 잘되니 후진을 기준으로 전진을
  # 수정"). What makes reverse good is that the tag is left 16 cm AHEAD of
  # the lens at the stop, so on the NEXT launch the start tag stays in view
  # for ~19 cm and the heading is held on the tag (a wheel-play twist the
  # encoders cannot see is still corrected). Forward stopped on the
  # crosshair, lost the start tag after 3 cm, and arrived on the zone A
  # lane yawed -0.6..-1.7 deg. +300 px = the tag ~12 cm ahead of the lens:
  # start tag visible ~15 cm at launch, and the target — which appears
  # ~25 cm out going forward — is still in view for ~13 cm of approach
  # (400 would leave only 9 cm). ⚠️ Every forward stop is now ~12 cm SHORT
  # of the design pose (lens over the tag); /robot_pose carries the
  # fore-aft term (robot_pose_use_fore_aft) so the reported pose and the
  # pose-mode arm transform stay right. 500-series targets keep 0 —
  # stop_offset_skip_tag_ranges below.
  center_x_stop_offset: 300.0
  # REVERSE-ONLY stop column (2026-09-04, user request: "후진할 때만 목표
  # 태그 위치를 화면 기준으로 최대한 오른쪽에"). Same units and sign as
  # center_x_stop_offset — px from the calibrated cx, positive = image-right
  # = AHEAD of the lens — but read only when the hop drives backward. In
  # reverse the tag enters from image-left (it emerges from behind the
  # bumper ~3 cm behind the lens) and travels right; the stop fires when it
  # reaches this column, so the base backs up until the tag sits this far
  # ahead of the lens. Forward hops are unaffected and keep using
  # center_x_stop_offset. Remove the key (or set null) to restore one shared
  # column for both directions.
  #
  # How far right is "as far as possible": front_cam is 1280 px wide with
  # cx ≈ 638, i.e. ~640 px of frame to the right of the crosshair. A 90 mm
  # tag at the 0.30 m camera height is ~222 px wide (fx ≈ 750), and the
  # detector needs the whole tag plus roughly one bit (~28 px) of quiet zone
  # in frame, so the tag CENTRE must stay under ~1100 px → offset ≤ ~460.
  # 400 keeps ~50 mm of margin for the post-trigger roll, a not-yet-aligned
  # tag and lateral error. Raise toward 460 only after checking the overlay
  # shows the whole tag at rest. 400 px ≈ 162 mm at this depth.
  #
  # ⚠️ Consequence: a reverse arrival now stops ~162 mm further along the
  # reverse direction than a forward arrival at the same tag, and
  # /robot_pose has no fore-aft term (it is map tag + lateral + camera
  # offset), so the next hop's odom distance is off by that much — longer
  # if it drives forward, shorter if it reverses again. Arrival is still
  # decided by the tag, so the hop still ends on the tag; only the speed
  # profile / blind-approach zone see the error. Both columns are drawn on
  # /front_cam/tag_overlay (FWD / REV labels) from these two keys.
  center_x_stop_offset_reverse: 400.0
  # Target tags that keep the FORWARD column even on a reverse hop (user
  # rule 2026-09-04: "500번대 태그가 목표 명령이면 기존 목표 태그 위치에
  # 멈춰야 해"). The 500-series are the dock and the corridor pivot tags —
  # a pivot turns about the base centre, so the base has to be ON the tag's
  # designed stop pose, not 162 mm short of it. Same [[lo, hi], ...] shape
  # as align_skip_tag_ranges; matched on the TARGET tag only.
  # (was center_x_stop_offset_reverse_skip_tag_ranges — still read as an
  # alias; since 2026-09-04 it applies to BOTH directions and the column
  # for these targets is the crosshair, offset 0.)
  stop_offset_skip_tag_ranges: [[500, 599]]
  # /robot_pose fore-aft term (2026-09-04). Until now the pose assumed the
  # lens sat over the tag (map tag + lateral + camera_offset only); with the
  # far stop columns the lens rests 12-16 cm short of the tag, so the tag's
  # fore-aft distance (tag x, + ahead of the lens) is now subtracted along
  # the zone heading. Applies to every consumer of /robot_pose (pose-mode
  # arm transform, UI). false restores the old lens-over-tag assumption.
  robot_pose_use_fore_aft: true
  # Tightened 10 -> 4 px on 2026-09-02 (user request). The trigger now fires
  # 4 px (~1.6 mm) before the target column instead of 10 (~4 mm). ⚠️ The
  # bigger error is AFTER the trigger: on 2026-09-02 arrivals recorded the
  # tag at +40..46 px, i.e. the base rolled ~15-20 px (6-8 mm) past the
  # trigger line at 0.010 m/s before it actually stopped. If the goal is the
  # tag exactly on the target column, that overshoot is what to compensate
  # (raise center_x_stop_offset by ~18 px), not this tolerance.
  center_x_stop_tolerance: 4.0
  # Stop-roll compensation (2026-09-02, "자꾸 태그를 지나쳐서 멈춰"). After the
  # stop command the base keeps rolling for about this long: measured from
  # arrival-vs-aligned records, forward rolled 5.8 mm (median, 23 hops) at
  # a 0.011 m/s command and reverse 12.6 mm (17 hops) at 0.022 m/s — i.e.
  # ~0.55 s either way. Modelled as a transport delay: the commands of the
  # last `stop_latency_s` have not been executed yet, so their integral is
  # the distance still to come, and the stop fires that far early along the
  # direction of travel so the base ENDS on the target column (the column
  # itself is unchanged; center_x_stop_tolerance is only a floor under this
  # lead). Fit it from nav_log: each arrival record carries
  # commanded_speed_at_stop_mps and stop_lead_mm, and the actual roll is
  # (arrival fore-aft - aligned fore-aft); roll/speed = latency. 0 disables.
  stop_latency_s: 0.55

  # Delays (seconds)
  stop_sleep_duration: 1.0

  # Safety timeout (seconds)
  # If tag not reached within this time, emergency stop
  navigation_timeout: 8.0

topics:
  # camera_rgb / camera_info are GONE. They pointed at /rgb and /camera_info
  # for a navigation camera that no launch in this workspace ever started, so
  # mobile_controller's own detector never saw a frame and /robot_pose never
  # published. Navigation now consumes front_cam_detections / front_cam_info
  # below, which robot_camera_node already produces.
  scan_signal: "/scan_finished"
  # cmd_vel / odom are consumed by the Navifra driver's base_controller node
  # (KU Polishing Robot Driver v0.16). Names already match the driver defaults.
  cmd_vel: "/cmd_vel"
  odom: "/odom"
  robot_pose: "/robot_pose"

  # New cameras owned by robot_camera_node (see robot_camera: / vision_stop:
  # below). Vendor launch args (camera_name= for orbbec, camera= for
  # realsense) already namespace image/camera_info under /front_cam/ and
  # /side_cam/; only override here if the vendor launch is customized.
  front_cam_image:      "/front_cam/color/image_raw"
  front_cam_info:       "/front_cam/color/camera_info"
  front_cam_detections: "/front_cam/tag_detections"
  side_cam_image:       "/side_cam/color/image_raw"
  side_cam_info:        "/side_cam/color/camera_info"
  side_cam_detections:  "/side_cam/tag_detections"
  hand_cam_image:       "/hand_cam/color/image_raw"
  hand_cam_info:        "/hand_cam/color/camera_info"
  hand_cam_detections:  "/hand_cam/tag_detections"

# Navifra KU Polishing Robot Driver v0.16 peripherals (navifra_devices.py).
# Drive control is NOT here — that is topics.cmd_vel / topics.odom above.
navifra:
  # --- Safety policy ---------------------------------------------------
  # Emergency stop is a HARDWARE circuit (PILZ PNOZmulti 2) that cuts motor
  # power independently of ROS. /safety/estop is read-only state feedback.
  # The software /estop topic was removed in driver v0.11 — do not look for it.
  #
  # require_safety_link: true  = refuse to move unless /safety/estop is fresh
  #                              and the Safety PLC reports connected
  #                     false = warn only, so the stack still runs when
  #                              safety_io_driver was not launched
  require_safety_link: false
  safety_timeout_s: 3.0       # /safety/estop older than this counts as stale

  # --- Battery ---------------------------------------------------------
  low_battery_pct: 20.0       # warn below this (/bms/state.percentage x100)

  # --- Lighting --------------------------------------------------------
  # LED ownership is split by channel and must stay split:
  #   VISION                  -> basler_camera_node (see the camera: block)
  #   STATUS_{red,green,blue}  -> task_executor (task state, below)
  # The VISION lamp is bracketed with the shutter inside the camera node so the
  # two cannot desynchronise; nothing else may drive /crevis/led/vision.

  # STATUS lamp colour per task state (one RGB lamp, 3 Bool channels)
  status_colors:
    idle:     "green"
    moving:   "blue"
    scanning: "cyan"
    error:    "red"

  # --- Lift ------------------------------------------------------------
  # Position is INCREMENTAL (encoder) and lost on power cycle, so homing is
  # required once per power cycle before any absolute position command.
  # Stroke measured 0 .. 6900 counts = 343.3 mm of arm-base extension; full
  # travel ~27.8 s. The drive is capped at 1000 rpm in hardware, so
  # up_speed_rpm / post_home_speed_scale in ~/navifra/param.yaml cannot make it
  # faster — see the note at jog_timeout_s.
  lift_settle_tol: 20         # |target-current| <= this counts as arrived
  lift_home_timeout_s: 130.0  # driver home_timeout_sec is 120 — allow margin
  lift_move_timeout_s: 60.0
  #
  # TODO(lift-transform): scan_height_counts is the lift position the arm
  # transform was calibrated at. arm_calibration.arm_base_z below is a CONSTANT
  # and does NOT track the lift, so moving the lift silently invalidates every
  # pose IK result. See docs/lift_arm_base_z_analysis.md before changing this.
  # Leave null to disable the scan-height guard.
  scan_height_counts: null
  scan_height_guard: "warn"   # "warn" | "refuse" | "off"

# What task_executor does when a task finishes NORMALLY. Does not apply to a
# preempted or failed task: a preempt means something else was asked for, and a
# failure leaves the robot where a human needs to look at it — unattended motion
# in either case would be a surprise.
#
# Tasks are meant to be composable, so finishing one does NOT drive back to
# START_TAG. Returning is its own task: send `TASK go_home` after it. That keeps
# every task a self-contained block that can be queued in any order.
task_flow:
  # Lift origin homing after the last scan group. Only for tasks whose CSV
  # carries a lift_height column, i.e. only tasks that raised it in the first
  # place. Runs AFTER the arm returns to its home pose, and it is what lets the
  # next task assume the lift starts at the origin.
  lift_home_on_finish: true

# lifter_node — the ONLY thing in apriltag_nav that commands the lift.
# Everything else reads /lifter/state (or NavifraDevices.lift_position,
# read-only) instead of publishing to /lift/*.
lifter:
  # Soft travel clamp [counts]. Every absolute target and every jog is clamped
  # to this range before it reaches the driver.
  #
  # soft_max is 6900 as of 2026-08-14 (was 7000): the top of travel, and the
  # count the scale below was measured at. It still does real work beyond
  # capping absolute targets — the same clamp bounds jog and the open-ended
  # up/down commands, and the upper end has NO limit switch (only the lower one
  # is wired), so anything driven past the stop is a stall, and that stall is
  # what corrupts the count (a descent from the upper stop counts backwards
  # ~500 for a few seconds). Do not raise this above 6900.
  soft_min_counts: 0
  soft_max_counts: 6900

  # ⚠️ There is no anti-backlash origin pass any more (removed 2026-08-10).
  # The drive has backlash, so a count reached by descending is NOT the same
  # physical height as the same count reached by climbing. The node used to
  # route every descending move through the origin to guarantee an upward
  # approach; that cost up to 56 s and guarded a case the task flow cannot
  # produce — every task ends with lift origin homing and nothing lowers the
  # lift mid-task, so absolute moves only ever climb from 0.
  #
  # What this means in practice: reach a scan height by homing and climbing.
  # A descending `goto`, or any `jog` / `up` / `down`, leaves the drive loaded
  # the other way and is logged as such. Absolute moves before origin homing
  # are refused outright, since the driver would silently ignore them.

  # Count -> millimetre scale for /lifter/height.
  # 343.2 mm / 6897 counts = 0.04976077, re-measured at the top of travel on
  # 2026-08-14: commanded to 6900 the drive settled at count 6897 (inside
  # lift_settle_tol) and the gauge read 343.2 mm of extension there. The scale
  # is derived from the count actually REACHED, not the commanded one.
  # The manipulator base therefore sits 652 mm above the ground at the lift
  # origin and ~995 mm at the top of the stroke.
  # Was 0.0487143 (341 mm / 7000, 2026-08-13), which ran 7.2 mm low over the
  # full stroke. Both sides are still real measurements, so mm_calibrated stays
  # true and the node does not warn at startup.
  mm_per_count: 0.04976077
  mm_calibrated: true

  # LIFT ORIGIN HOMING once at node start. This is the lift descending to its
  # lower limit switch to zero the encoder — NOT the arm's home pose
  # (/arm/move_home), which is a different device and a different node.
  # Default false for the same reason the arm does not move at startup:
  # launching the stack is not a request to move hardware.
  # ⚠️ true here makes the lift DESCEND to the lower limit immediately.
  # Note the driver has its own auto_home_on_start (true in ~/navifra/param.yaml
  # on this robot), so the lift may already be origin-homed before this node
  # starts. Two settings, two processes; this one does not override that one.
  auto_home_on_start: false

  # Bound on an open-ended `up`/`down` jog, which the driver would otherwise
  # run until stopped.
  #
  # ⚠️ The drive is capped at 1000 rpm by a HARDWARE setting on the MDROBOT
  # controller (raisable to 16000, deliberately left at 1000). Raising
  # up_speed_rpm or post_home_speed_scale in ~/navifra/param.yaml therefore
  # changes nothing — the current 2000 and 2.0 are both already clipped. So
  # full travel is ~28.2 s over 7000 counts, and a worst-case jog (0 -> 6900)
  # takes ~27.8 s of it, leaving only ~7.2 s of margin here. If anyone ever
  # lowers the hardware cap, raise this with it or a legitimate jog will time
  # out mid-travel.
  jog_timeout_s: 35.0

  publish_rate_hz: 2.0

# Wrist Basler camera — owned exclusively by basler_camera_node.
#
# The device is kept CLOSED between captures (heat / sensor lifetime / power),
# NOT merely "not grabbing". Callers request frames over the /camera/capture
# service and get them in the reply; there is no continuous image stream.
# basler_camera_node also owns the VISION lamp so it is lit only while the
# shutter is open. Nothing else may open the camera or drive
# /crevis/led/vision.
#
# NOTE: this is the wrist/scan camera only. The front navigation camera is a
# separate device and publishes topics.camera_rgb above.
camera:
  service: "/camera/capture"
  num_samples: 1              # frames per capture when the request says <= 0
  delay_between_s: 0.2        # delay between frames inside one burst
  use_vision_led: true        # light the VISION lamp around the grab
  warmup_s: 0.15              # settle time after lamp on / grabbing start
  grab_timeout_ms: 5000       # per-frame RetrieveResult timeout
  capture_timeout_s: 20.0     # client-side wait_for_service timeout
  publish_last: true          # also echo frames on /basler/image_raw (debug)

  # Seconds to keep the device open after a capture, so a multi-point scan does
  # not thrash Open/Close. 0 = close immediately after every capture.
  # Must stay well above the arm's travel time between adjacent scan points,
  # otherwise the saving is lost to reopen latency.
  idle_close_sec: 5.0

# robot_camera_node — owns front_cam (Orbbec Femto Bolt) and side_cam (Intel
# RealSense D405), runs AprilTag detection on each, and ONLY publishes results
# (topics.front_cam_detections / topics.side_cam_detections above). It must
# never touch /cmd_vel or any stop method -- that decision lives in
# vision_stop: below / mobile_controller.py. See CLAUDE.md "Vision-Triggered
# Soft Stop".
robot_camera:
  tag_family: null   # null = reuse robot.tag_family above

  # Tag size is PER CAMERA, because the cell uses two physical tag sizes and
  # dt_apriltags scales pose_t linearly by this number: a wrong value corrupts
  # tag.z (the final-approach trigger) and tag.y (lateral, which feeds
  # /robot_pose). One global size cannot serve both cameras.
  #   front_cam — 90 mm floor tags, read straight down
  #   side_cam  — 30 mm tags on the 80 mm 정반 step, read horizontally
  #   hand_cam  — 90 mm reference tags (path_tag_locator's tag A, six of
  #               them, switched from 60 mm on 2026-09-01; locator.yaml
  #               detector.hand_cam_tag_size_m must match)
  # An entry set to null falls back to robot.tag_size above.
  tag_size:
    front_cam: 0.09
    side_cam:  0.03
    hand_cam:  0.09

  # dt_apriltags quad_decimate, PER CAMERA. The library default is 2.0
  # (detect on a half-resolution image, then refine). Fine for front_cam —
  # 1280x720, the 90 mm floor tag is ~180 px at 0.3 m, and the 30 Hz /
  # 109 ms figures in CLAUDE.md were measured at 2.0 — but on the 640x480
  # RealSense cameras it broke the calibration align on 2026-09-02:
  # hand_cam's 69 px ref tag at 0.8 m became ~35 px, giving no detection or
  # corrupted corners with a 20-30 deg bogus tilt (offline on a saved frame:
  # 1.0 -> tilt 2.7 deg, 1.5 -> 20.7 deg, 2.0 -> nothing). side_cam's 30 mm
  # tags are smaller still. 1.0 = full resolution.
  quad_decimate:
    front_cam: 2.0
    side_cam:  1.0
    hand_cam:  1.0

  # Per-camera on/off for the detectors, and the persistent default for each
  # camera. This controls robot_camera_node only; the driver that publishes
  # the images is started by mobile_manipulator.launch's use_<name>_cam args.
  # Setting use_<name>_cam:=false there also forces the detector off (a
  # detector with no driver would wait forever), so the launch arg is the
  # one to reach for when disabling a camera for a single run:
  #   roslaunch apriltag_nav mobile_manipulator.launch use_hand_cam:=false
  # Turning a camera off HERE alone stops the detection but still runs the
  # driver, so it keeps costing USB bandwidth — useful only when something
  # else needs that camera's images.
  enabled:
    front_cam: true    # Orbbec Femto Bolt — feeds the vision_stop consumer
    side_cam:  true    # RealSense D405
    hand_cam:  true    # RealSense D435

  # Vendor service that starts/stops the camera's own stream, called by
  # /robot_camera/<name>/set_enabled so one command turns the whole camera
  # off rather than just muting detection. Both vendors use std_srvs/SetBool
  # but name it differently. Set an entry to null to leave that driver
  # running and switch the detector alone.
  driver_toggle:
    front_cam: "/front_cam/toggle_color"   # orbbec_camera, per-stream
    side_cam:  "/side_cam/enable"          # realsense2_camera, whole device
    hand_cam:  "/hand_cam/enable"          # realsense2_camera, whole device

# Vision-triggered soft stop, handled entirely in mobile_controller.py. When
# front_cam sees a configured AprilTag ID centered in frame, mobile_controller
# calls preempt_stop_robot() -- the SAME stop_requested latch that TASK/GOTO
# already clear inside move_to_tag() via clear_stop_flag(), so the robot stays
# stopped until an explicit next TASK/GOTO command; no separate "hold until
# resumed" logic exists or is needed.
#
# *** stop_tag_ids is a PLACEHOLDER. The real tag ID(s) that should trigger a
# stop have NOT been decided yet -- do not deploy to the real robot with a
# guessed ID. Fill in before hardware testing. ***
vision_stop:
  enabled: true
  stop_tag_ids: []          # PLACEHOLDER -- e.g. [42]. Empty = feature inert.
  center_tolerance_px: 40.0 # max pixel distance from image center to count as "centered"

# 4-DOF physical mounting model — validated against 328 paired joint/pose
# rows (mean residual 12 mm, max 27 mm). See CLAUDE.md "Transform Parameters".
# These are the source of truth; controllers may still override via ROS
# private params if needed.
arm_calibration:
  # Source of truth: path_tag_locator/config/extrinsics.yaml T_ab2mb
  # (platform-measured; R = Rz(180°) exactly, t = (0, -0.100, -0.652)).
  # Two independent confirmations that the mount has NO tilt: the extrinsics
  # measurement, and the 655-point real-robot fit (task/csv/
  # calib_data_params.yaml) which found tilt_x/y ≈ 0.0001/0.0007 rad.
  #
  # ⚠️ arm_base_z is the height WITH THE LIFT AT ITS ORIGIN. The lift adds up
  # to 343 mm on top of it (0.652 -> 0.995 m at 6900 counts) and this value
  # does NOT track it — see the TODO at navifra.scan_height_counts.
  #
  # ⚠️ 0.651 -> 0.652 on 2026-08-23, and that 1 mm is a DESIGN FIGURE overriding
  # a measurement, not a re-measurement. 651 was taped on the replacement base
  # 2026-08-13; 652 is what the cell design record (the parent directory's
  # CLAUDE.md, §3 mounts table) specifies. Unreconciled, same shape as the
  # camera_offset 547/550 conflict above. It must stay equal to -tz of
  # extrinsics.yaml T_ab2mb and to the fallback in arm_transform.py — three
  # sites, change them together.
  #
  # Superseded values (kept for the record — all belong to the OLD mobile base,
  # which was replaced 2026-08-13):
  #   arm_base_z 1.025 — the old base's measured height, and what every earlier
  #   note in this file and in CLAUDE.md was written against.
  #   arm_base_z 1.0076 + tilts -0.02248/+0.02639 — derived from the USD sim
  #   scene; the tilts do not exist on the real platform.
  #   The 655-point fit's arm_base_z was 0.9541. That fit is old-base data and
  #   no longer comparable to the value below; the "71 mm discrepancy" it used
  #   to raise is moot.
  arm_body_offset_x: 0.0       # arm mount in body frame X (m)
  # Moved 100 mm toward the wall (body -Y, the side_cam side) on 2026-08-13 to
  # cancel the 100 mm the wider 0.70 m body pushes the robot centre away from
  # the wall. Net absolute arm position is unchanged — that is the whole point.
  # Read by arm_transform.py into p_A_W, so POSE mode follows it automatically.
  # ⚠️ JOINT mode does not: those CSVs are absolute arm configurations and no
  # transform touches them, so they are only still valid if the robot's stop
  # position really does move the matching 100 mm.
  arm_body_offset_y: -0.100    # arm mount in body frame Y (m)
  arm_base_z:        0.652     # arm base height above the ground (m), lift at origin
  arm_mount_yaw:     3.14159265358979  # rad (pi, exact per extrinsics)
  arm_tilt_x:        0.0       # no mount tilt on the real platform
  arm_tilt_y:        0.0       # no mount tilt on the real platform

# Arm home joint angles in radians. This matches the hardcoded value used
# across every controller (arm_controller.py, tools/arm_controller_sdk.py)
# — they all use j1 = -1.5708, not 0.0. Keep this in sync if either side changes.
arm_home:
  joints_rad: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]

# Keyence DL-EN1 displacement sensor closed-loop tuning
keyence:
  ip: "192.168.100.105"
  port: 64000

  # INFORMATIONAL ONLY — nothing reads this. The zero point is configured in
  # the DL-EN1 itself; the controller simply drives the published value to 0.
  # Measured on the real sensor: the reading is zero at a 10 mm standoff.
  # (It said 30.0 until 2026-08-05, which matched no hardware setting.)
  target_distance_mm: 10.0

  # SENSOR POLARITY (set in the DL-EN1, confirmed on the robot 2026-08-05):
  #   distance > 10 mm (too far)   -> reading NEGATIVE
  #   distance = 10 mm             -> reading 0
  #   distance < 10 mm (too close) -> reading POSITIVE
  # i.e. the reading rises as the tool approaches the surface. That is the same
  # thing the sweep in tools/measure_keyence_angle.py measures as k > 0, and it
  # is what forces keyence_dir = -sign(k) = -1.0 (set in the launch file):
  # a NEGATIVE reading means retreat is wrong, the tool must move CLOSER.
  # Both routes agree; re-derive both if the sensor is reconfigured.

  # Angle between the laser beam and the tool Z axis, degrees. The beam is
  # mounted OBLIQUE on this platform, so the reading is a distance along the
  # beam, not the perpendicular standoff: a perpendicular error e reads as
  # e/cos(angle). arm_controller projects the reading by cos(angle) FIRST and
  # then does everything else in perpendicular millimetres.
  #
  # Consequence for tuning: tolerance_mm, keyence_max_step_mm and
  # keyence_activate_threshold are all PERPENDICULAR standoff mm — the quantity
  # the scan actually cares about — never the raw reading. At 42.6 deg the raw
  # reading is 36% larger than the perpendicular error it represents.
  #
  # MEASURED on the real robot 2026-08-05 with tools/measure_keyence_angle.py,
  # tool pointing straight down (tool Z = [0, 0, -1] in base) on the workpiece:
  #   sweep +/-1 mm, 5 pts -> k = 1.3717 -> 43.20 deg  (R^2 0.99899)
  #   sweep +/-2 mm, 5 pts -> k = 1.3450 -> 41.97 deg  (R^2 0.99911)
  # The 1.2 deg spread is dominated by surface topography, not sensor noise
  # (sensor sd is ~3 um): because the beam is oblique the spot TRANSLATES
  # across the surface as Z changes, so each sample sees slightly different
  # material. Re-measure if the sensor is remounted.
  #
  # The loop is insensitive to this 1.2 deg residual uncertainty: once the
  # projection is applied the 1/cos factor cancels, so the per-step residual is
  # |1 - kp| regardless of the angle. The angle only has to be right enough
  # that cos is right — 42.0 vs 43.2 deg differs by 2% in cos.
  #
  # NOTE the angle was NOT harmless before it was measured: leaving this at 0
  # kept the reading's 1/cos factor, making the true gain kp/cos. At the launch
  # file's kp 0.8 and this 42.6 deg mount that came to 1.087 — accidentally
  # close to deadbeat, which is why the uncorrected loop appeared to work. That
  # coincidence would have broken the moment kp was retuned or the sensor
  # remounted; an uncompensated mount diverges past 66.4 deg at kp 0.8.
  beam_angle_deg: 42.6

  # Direction sign. The same measurement found k POSITIVE (the reading grows as
  # the tool moves +Z, toward the surface), and dir must be -sign(k), so the
  # correct value is -1.0. It was +1.0 — an unverified default — which amplified
  # the error by (1 + kp) every step and drove the tool into the workpiece.
  # It lives as ~keyence_dir on arm_node; the launch file sets -1.0.
  #
  # --- Closed-loop tuning ------------------------------------------------
  # PRECEDENCE: arm_controller reads ~params on arm_node FIRST and
  # falls back to these. mobile_manipulator.launch sets keyence_tol, keyence_kp,
  # keyence_max_steps and keyence_max_step_mm, so for a normal launch THOSE win
  # and these are only the fallback for running the controller without the
  # launch file. They were 0.5 / 5 / 0.5 while the launch used 0.2 / 10 / 0.8 —
  # aligned 2026-08-05 so both paths behave the same.
  #
  # UNITS: every value below is PERPENDICULAR standoff mm. The raw reading is
  # projected by cos(beam_angle_deg) before any of them is applied.
  tolerance_mm:        0.2    # ~keyence_tol        — converged when |perp| <= this
  kp:                  0.8    # ~keyence_kp         — per-step residual is |1 - kp|
  max_steps:           10     # ~keyence_max_steps  — give up after this many
  max_step_mm:         1.0    # ~keyence_max_step_mm — single-step clamp
                              #   TEMPORARY bring-up value; launch says 5.0 is
                              #   the normal setting. See the launch comment.
  activate_threshold:  5.0    # ~keyence_activate_threshold — skip the loop when
                              #   |perp| >= this (too far to trust the reading)

  # NOTE: there is no timeout_s here on purpose. The socket timeout belongs to
  # keyence_dlen1_node (~timeout_s, 5.0 in the launch file), not to this
  # controller-side block. A `timeout_s: 0.5` key sat here until 2026-08-05 and
  # was read by nothing at all.

# Inference / model
inference:
  input_height: 900
  input_width: 900
  mean: [0.5, 0.5, 0.5]
  std:  [0.5, 0.5, 0.5]
