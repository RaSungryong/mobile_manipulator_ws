    level-floor prior on front_cam rotation; confirmed by the independent 2026-09-21 session (64 views): translation residual (-2.2, -0.9, -1.9) mm, yaw residual 0.09 deg. Lift at ORIGIN — consumers subtract
    the live lift (chain.compensate_T_ab2mb). vs design (0,-100,-652)/Rz(180): translation off (14.5, 20.7, 12.7) mm, yaw 1.34 deg, roll/pitch ~0 (mount has no tilt; the 09-18 1.2 deg roll was paper under
