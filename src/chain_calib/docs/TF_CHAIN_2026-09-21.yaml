accuracy:
  per_view_floor: ~8.5 mm / 0.65 deg rms per view (hand_cam per-view orientation ~0.5 deg x the ~1 m lever to tag 200)
  position_dependent: +-12 mm across 0.6 m of arm x travel (arm FK / structure, 2 deg per 0.6 m) — not a constant TF
  re_parking: ~8 mm constant shift per re-parking / re-laying (chassis attitude + paper)
  practical: 'a floor tag located through this chain: ~+-10 mm over +-0.3 m of arm travel'
not_in_this_chain:
