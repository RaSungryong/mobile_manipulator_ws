accuracy:
  per_view_floor: 8-9 mm / 0.6-0.9 deg rms per view (hand_cam per-view orientation ~0.5 deg x the ~1 m lever to tag 200)
  position_dependent: +-12 mm across 0.6 m of arm x (arm FK / structure, 2.1 deg per 0.6 m) — not a constant TF
  practical: 'a floor tag located through this chain: ~+-10 mm over +-0.3 m of arm travel, 2-5 mm near the calibrated area'
not_in_this_chain:
  robot_yaml_arm_calibration: pose-mode IK still uses the DESIGN T_ab2mb (planner URDF + check_pose_vs_joint.py are written to it) — separate decision
  vision_tip: Basler vision tip (0,-253,225.2) mm from the flange, never measured on this robot — see basler_tip_calib
