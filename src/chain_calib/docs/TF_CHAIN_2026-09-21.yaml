title: mobile manipulator TF chain — hand_cam -> flange -> arm base -> mobile base -> front_cam
date: '2026-09-21'
git_before_this_commit: 5fe46e5
convention: 'T_X2Y = pose of frame Y expressed in frame X (a Y-frame point p maps to X as T_X2Y @ p). Row-major 4x4, metres. rpy_deg_xyz = scipy extrinsic xyz euler. Chain: T_hc2fc = T_hc2ee . T_ee2ab .
  T_ab2mb . T_mb2fc, with T_ee2ab = inv(T_ab2ee) from the arm FK (/arm/state flange pose, Fairino mm/deg ZYX).'
frames:
  hc: 'hand_cam optical frame (RealSense D435 colour): x image right, y image down, z optical axis'
  ee: arm FLANGE (what /arm/state reports; the controller active tool is the flange, CLAUDE.md 2026-09-14)
  ab: arm base_link (Fairino base)
  mb: 'mobile base body frame: x forward, y left, z up, origin at the floor under the chassis centre'
  fc: front_cam optical frame — physical (tilted 1.44 deg; for consumers that re-detect RAW frames) and level (the virtual level camera /front_cam/tag_detections is published in while ground_plane is on;
    x = robot forward, y = robot right, z down)
  W: 'the A0 sheet frame = tag 200: +x paper right (= robot RIGHT as laid), +y paper down (= robot REAR), +z into the paper (down); every sheet tag is a pure translation of it'
T_hc2ee:
  source: path_tag_locator/config/hand_eye/T_hc2ee.npz — hand-eye sweep 2026-09-18 (35 samples, tag-scatter refined); the 2026-09-21 chain_calib joint fit puts its error at ~6 mm / 0.6 deg, inside this
    data's hand-eye resolution, and the spin test (62 vs 152 deg) moves the FK grid normal 0.55 deg, inside per-view scatter — no sign the camera moved
