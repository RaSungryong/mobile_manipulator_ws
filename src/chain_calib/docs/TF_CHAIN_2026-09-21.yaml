    rad — pose-mode IK (transform_world_to_arm). Applied 2026-09-21 so the arm goes where the locator chain says a tag is; arm_node restart.
  planner_urdf: frcobot_description/urdf/fr10v6_mobile_vision_0317_test.urdf mobile_to_base xyz (0.013008, 0.120318, 0.629002) rpy (0.005926625, 0.013580283, 0.024986084) — the same transform seen from
