# scripts/generate_calibration_artifacts.py (lift 0 mm, view 0.50 m)
# — do not hand-edit; re-run the generator.
#
# THIS IS NOT A CALIBRATION. One path tag (141), one ref tag
# (3), 6 different CAMERA YAWS spanning 355°. The base never
# moves, so front_cam's view of the tag is identical every time
# and cancels; only the ARM side varies.
#
# Read it with: rosrun path_tag_locator analyse_yaw_sweep.py <session_dir>
#   large circle radius          -> HAND-EYE is wrong
#   radius ~0 but the normal session shows a large absolute
#   error                        -> FRONT_CAM (T_mb2fc) is wrong
#
# ⚠️ Park the base ON tag 141 and leave it there. Do NOT reorder
# the entries and do NOT let a TASK/GOTO move the base midway —
# a moved base breaks the common factor the whole method rests
# on. Run with ref_tags_path = config/reference_tags_plate2.yaml.

