# T_hc2ee direct-input interface
# ==============================
# Use this to generate the npz from a directly measured hand-eye value.
# If a proper calibration result from `handeye_calib_node` is available,
# this file is not needed.
#
# T_hc2ee = "pose of the end-effector as seen in the hand-cam frame"
#         = T_gripper2cam of OpenCV calibrateHandEye
#
# Two input formats are accepted:
#   format: "pose"    -> position_m + rpy_deg (ZYX intrinsic, degrees)
#   format: "matrix"  -> matrix_4x4 (row-major 16 floats)
#
# Usage:
#   rosrun path_tag_locator save_npz.py
#   (or: python3 scripts/save_npz.py)
# By default this file is read to generate config/hand_eye/T_hc2ee.npz.
# An existing npz is not overwritten unless --force is given.

format: "pose"

# === Enter the measured values here ===
# Units: position in meters (m), rotation in degrees (deg, ZYX intrinsic)
# The example below is the nominal hardware design value
# (EE of vision_tip in the hand-cam frame):
position_m: [0.03250, -0.16246, -0.16775]
rpy_deg:    [0.0, 0.0, 180.0]

# To use the matrix format, comment out the two entries above and use:
# format: "matrix"
# matrix_4x4:
#   [-1.0,  0.0,  0.0,  0.03250,
#     0.0, -1.0,  0.0, -0.16246,
#     0.0,  0.0,  1.0, -0.16775,
#     0.0,  0.0,  0.0,  1.0]
