# Reference tags with accurate world coordinates provided by the user.
# These are the "trusted truth" against which all path tags are calibrated.
#
# The "world frame" used here is defined by YOU — typically with one tag
# chosen as the origin (its pose = identity). For example, the default
# below treats tag id=0 as the origin: position_m=[0,0,0], rpy_deg=[0,0,0].
# All other ref tags' position_m / rpy_deg are measured relative to that
# origin.
#
# IMPORTANT: this world frame is NOT the same as apriltag_nav's map.yaml
# Manipulator frame. The calibrator output (map_world.yaml) lives in
# the WORLD frame defined here and is NOT a drop-in for map.yaml.
#
# Each entry's pose is "pose of the tag in the world frame". Use either:
#   format: pose      ->  position_m + rpy_deg  (ZYX intrinsic, degrees)
#   format: matrix    ->  matrix_4x4 (row-major 16 floats)
#
# Optional per-tag ``size_m`` overrides the default tag_a_size_m from
# locator.yaml; useful if your ref tags differ in physical size.
#
# 2026-09-01: the cell has SIX reference tags (cross tags, ids 0-5), all
# 90 mm (tag_a_size_m 0.090 and robot.yaml robot_camera.tag_size.hand_cam
# 0.09 already say so — a per-tag size_m is only needed if one ever
# differs again). Real design-record poses are filled in below.

format: "pose"

# Rotation convention (AprilTag library):
# A tag's local +z points INTO the tag, AWAY from the printed face.
# So the rpy_deg you declare must match each tag's PHYSICAL mounting:
#
#   - tag FACE DOWN (face points downward, viewed from below;
#                    this project's default convention)
#       -> tag's z = world +z (up)
#       -> rpy_deg = [0, 0, 0]    (no rotation from world axes)
#   - tag FACE UP   (face points upward, viewed from above;
#                    common for floor stickers)
#       -> tag's z = world -z (down)
#       -> rpy_deg = [180, 0, 0]  (flip about x)
#
# The entries below are face-UP tags (on the plate top, read by hand_cam
# from above), hence rpy [180, 0, 0].

# ---------------------------------------------------------------------
# REAL VALUES — the six 90 mm cross tags (십자태그), filled 2026-09-01
# from the design record "십자태그 위치.csv".
#
# WORLD FRAME == map.yaml frame: origin at the centre of 정반 1, +x east,
# +y north, z = 0 at the PLATE TOP surface. Verified against
# "1번정반 중심 기준 모든 태그들의 위치.csv", which matches
# apriltag_nav/config/map.yaml exactly (72/72 tags), so calibrated world
# outputs are directly comparable with map.yaml x/y. Floor tags sit 80 mm
# below the plate top — a healthy first session should report path-tag
# z ≈ -0.080.
#
# The tags lie ON the plate, printed face UP (hand-cam reads them from
# above) -> rpy [180, 0, 0] per the convention block above.
# ⚠️ Yaw is ASSUMED 0 (tag x-axis along world +x). A wrong ref yaw
# rotates every computed position about that tag — verify_map_world.py's
# relative-geometry check will expose it on the first session; correct
# the yaw here if it does.
#
# 정반 2 note: its cross tags carry the SAME ids 0-5 and live in
# reference_tags_plate2.yaml = these poses + 3.890 m in x (정반 2's
# GEOMETRIC centre; the "2번정반 중심 기준" CSV origin is +3.420 and is NOT
# where those tags are laid — see the 2026-09-01 Work Log). Plan file and
# ref file swap together; never calibrate plate 2 against this file.
# ---------------------------------------------------------------------
reference_tags:
  # West column (x = -0.600), south -> north
  - id: 0                      # origin-column tag, south
    position_m: [-0.600, -1.200, 0.0]
    rpy_deg:    [180.0, 0.0, 0.0]
  - id: 1
    position_m: [-0.600, 0.000, 0.0]
    rpy_deg:    [180.0, 0.0, 0.0]
  - id: 2
    position_m: [-0.600, 1.200, 0.0]
    rpy_deg:    [180.0, 0.0, 0.0]
  # East column (x = +0.600), north -> south
  - id: 3
    position_m: [0.600, 1.200, 0.0]
    rpy_deg:    [180.0, 0.0, 0.0]
  - id: 4
    position_m: [0.600, 0.000, 0.0]
    rpy_deg:    [180.0, 0.0, 0.0]
  - id: 5
    position_m: [0.600, -1.200, 0.0]
    rpy_deg:    [180.0, 0.0, 0.0]
