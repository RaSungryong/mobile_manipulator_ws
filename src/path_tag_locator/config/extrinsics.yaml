# Platform-fixed extrinsics. Row-major 4x4 (length 16). Edit if the platform
# geometry changes.
#
# Convention (matches geometry.py): T_X2Y = pose of frame Y expressed in
# frame X (i.e. applied to a Y-frame point it returns the X-frame point).
#
#   T_ab2mb: pose of mb(mobile_base) in ab(arm_base) frame.
#            R = diag(-1, -1, +1)  -> mb axes vs ab: x=-x, y=-y, z=+z
#                                     (= Rz(180°), matches arm mounted backwards)
#            t = (0, -0.1, -0.652) m -> mb origin is 652 mm below the arm base
#                                     along ab.z (arm sits on top of the cart),
#                                     and 100 mm off along y.
#            Measured on the REPLACEMENT mobile base 2026-08-13 with the lift
#            at its origin, corrected 651 -> 652 on 2026-08-23 to match the
#            cell design record. Figures from before that base swap describe
#            different hardware — do not treat them as discrepancies.
#            The lift adds up to 343 mm on top of this and is NOT reflected
#            here.
#            Since 2026-09-01 path_tag_locator's chain compensates for the
#            lift at runtime (chain.compensate_T_ab2mb + live /lifter/height),
#            so KEEP this value lift-at-origin — never bake a lift height in.
#            The y term is the 2026-08-13 arm relocation: the arm base was
#            shifted 100 mm toward the wall, i.e. mb-frame y = -0.100. Both
#            signs come out negative because Rz(180) flips y and the inverse
#            flips it back. Must equal robot.yaml `arm_body_offset_y`.
#            ⚠️ CALIBRATED 2026-09-18 (chain_calib, printed A0 tag sheet as
#            the ground truth, 50 hand_cam views over tags 300-309 with
#            front_cam on tag 200; src/chain_calib/docs/
#            CHAIN_CALIB_2026-09-18_kr.md): the design matrix above is now
#            t = (-13.2, -118.0, -642.7) mm, rpy (-1.247, -0.457, 178.710)
#            deg — i.e. the mobile base seen from the arm base is 13 / 18 /
#            9 mm and 1.3 deg off the design figures. The correction was
#            fitted as F in the fc frame (F_base of corrections.npz, +10.8 /
#            -12.3 / -13.6 mm, -1.25 / +0.46 / +1.29 deg) and folded in as
#            T_ab2mb' = T_ab2mb_design . T_mb2fc . F . inv(T_mb2fc), so the
#            GENERATED T_mb2fc below is untouched. It cannot separate an
#            arm-mount error from a front_cam error (one base pose), and
#            does not need to: every consumer of this file uses the product.
#            Verified on the robot the same evening (verify_chain.py):
#            hand_cam driven through this chain to 0.50 m above each of the
#            10 grid tags lands the tag 0.3 / 0.7 mm (mean) from the image
#            centre at 0.504 m — the 25 mm / 2 deg raw chain error is gone;
#            what remains (+-12 mm, linear in arm x, 2.1 deg / 0.6 m) is the
#            ARM's position-dependent orientation error, not this matrix.
#            Print scale used: sx 0.998 / sy 0.996 / tag 89.7 mm (estimated
#            from the data; the design-scale solve differs by 1-3 mm).
#            robot.yaml arm_calibration (pose-mode IK) and the planner URDF
#            still carry the DESIGN value — a separate decision; changing
#            them would move every pose-mode target 13-18 mm.
#   T_mb2fc: pose of fc(front_cam) in mb(mobile_base) frame — the PHYSICAL
#            optical frame, tilt included (2026-09-15). GENERATED by
#            scripts/make_front_cam_extrinsics.py from three robot.yaml
#            numbers; never hand-edit the block:
#              tx  = robot.camera_offset (0.55)
#              tz  = robot_camera.ground_plane.front_cam.height_m (0.302,
#                    the lens height above the TAG-TOP plane from the
#                    2026-09-08 tag-pair fit; it was 0.300 — a tape figure —
#                    until 2026-09-15, user: keep the two equal)
#                    + robot.tag_thickness (0.001: every laid tag is a 1 mm
#                    plate, so the lens is 0.303 above the FLOOR = mb origin
#                    and a located floor tag sits at z = +0.001 in mb)
#              R   = R_level @ inv(T_tilted_to_level(roll, pitch, yaw))
#                    with the fit's roll +1.406 / pitch -0.323 (2026-09-15
#                    re-measurement; +1.228 / -0.504 on 09-08) / yaw -0.380
#                    deg (apriltag_nav.ground_plane conventions) and
#                    R_level = diag(+1, -1, -1), see below. The optical
#                    axis is 1.443 deg off vertical.
#            ⚠️ robot_camera_node re-images front_cam's detections through a
#            LEVEL virtual camera whenever the ground-plane correction is
#            enabled, so a chain fed from /front_cam/tag_detections must
#            use T_mb2fc_level = T_mb2fc @ T_tilted_to_level(...), whose
#            rotation is exactly the pre-2026-09-15 R below and whose
#            translation is the same lens centre. path_tag_locator's
#            load_extrinsics_full() derives it, checks the stored matrix
#            against robot.yaml (0.01 deg / 1e-6 m) and picks the right
#            one per locator.yaml detector.front_cam_frame ("auto" = follow
#            ground_plane.enabled). The stored physical matrix is for
#            consumers that re-detect RAW frames (verify_arm_pointing).
#
#            The level frame (= the detector frame before the tilt was
#            measured): z along the optical axis (down), x = image column +,
#            y = image row +, so dt_apriltags pose_t maps straight onto it.
#            ⚠️ tx 0.547 -> 0.55 on 2026-08-21, following camera_offset.
#            0.547 was measured 2026-08-13; 0.55 is what the new cell's
#            map.yaml was generated from, and only 0.55 reproduces its
#            documented dock stop (x -1.9123). The 3 mm is unreconciled —
#            see robot.yaml. The lever from the 2026-09-08 pivot fit is
#            0.552 ± 0.001 m, which stands with 0.55.
#            The lens is on the centreline, so it sits ON the rotation axis
#            of the 2026-08-13 remount; the 100 mm is the mount, not the
#            rotation.
#
#            R_level: the camera was physically turned -90° about its own
#            (downward) optical axis on 2026-08-13, i.e. R_new = R_old · Rz(-90°):
#                fc.x = +mb.x  -> image RIGHT is the robot's FORWARD
#                fc.y = -mb.y  -> image DOWN  is the robot's RIGHT (wall side)
#                fc.z = -mb.z  -> optical axis, down
#            i.e. R_level = diag(+1, -1, -1). (Before the rotation:
#            fc.x = -mb.y, fc.y = -mb.x.)
#
#            Confirmed by what the operator sees in the FOV, which is worth
#            keeping because the two observations look contradictory until you
#            notice the mounting: THE LENS IS 100 mm AHEAD OF THE FRONT BUMPER
#            (body is 0.90 m long -> front face at 0.45 m; the lens is at
#            0.55 m). So the bumper is BEHIND the camera and the tag is ahead:
#                front bumper -> appears on the LEFT  of the image (aft side)
#                approaching tag -> enters from the RIGHT of the image
#            Both follow from fc.x = +mb.x, and both were observed.
#
# Re-measure on the real platform if geometry changes (the previous tuning
# from tranformation_ws/transform_chain/constants.py used different numbers
# and is no longer authoritative).

T_ab2mb_row_major:   # CALIBRATED 2026-09-18 by chain_calib (A0 tag sheet, session log/chain_calib/20260918, base fit F_base) — see the comment block above; design value was diag(-1,-1,1) / (0, -0.100, -0.652)
